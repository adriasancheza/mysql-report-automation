[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mysql-report-automation"
version = "0.1.0"
description = "A CLI that turns SQL queries into scheduled, formatted Excel reports and emails them."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Adrià Sánchez", email = "gs.yigi31@gmail.com" },
]
keywords = ["mysql", "excel", "reporting", "automation", "cli", "email"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "SQLAlchemy>=2.0",
    "PyMySQL>=1.1",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/adriasancheza/mysql-report-automation"
Issues = "https://github.com/adriasancheza/mysql-report-automation/issues"

[project.scripts]
report = "mysql_report_automation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mysql_report_automation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mysql_report_automation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
